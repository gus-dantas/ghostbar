<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ghostbar Prompter</title>
  <link rel="stylesheet" href="./prompter.css">
</head>
<body>
  <main class="card">
    <div class="top" data-tauri-drag-region><span class="rec" id="rec"></span><span id="count"></span><div class="bar"><i id="prog"></i></div><span id="time"></span></div>
    <div class="title" id="title"></div>
    <div class="cues" id="cues"></div>
    <div class="next" id="next"></div>
    <div class="row">
      <button id="prev" title="Back one block (←)">◀</button>
      <button id="redo" title="Say this block again (R)">↺ Redo</button>
      <button class="go" id="go" title="Next block (→ or space)">Next ▶</button>
    </div>
    <div class="keys">→ / space next · R redo · ← back · drag the top to move it under your camera</div>
    <div class="flash" id="flash"></div>
  </main>
  <script type="module" src="./prompter.js"></script>
</body>
</html>
