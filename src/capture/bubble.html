<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gus Assistant Camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .ring {
      /* 24px of room (BUBBLE_MARGIN in cast.rs) keeps the shadow inside the window */
      position: absolute; inset: 24px; border-radius: 50%; overflow: hidden; background: #0A1413; cursor: grab;
      box-shadow: 0 0 0 4px #fff, 0 6px 16px rgba(0, 0, 0, .35);
    }
    .ring:active { cursor: grabbing; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; display: block; }
    .msg {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; text-align: center;
      color: #ececf1; font: 600 12px/1.35 -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body>
  <div class="ring" id="ring" title="Drag to move">
    <video id="cam" muted playsinline autoplay></video>
    <div class="msg" id="msg" hidden></div>
  </div>
  <script type="module" src="./bubble.js"></script>
</body>
</html>
